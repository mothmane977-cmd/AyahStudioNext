
name: Build AyahStudioNext APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          mkdir -p project
          unzip -q AyahStudioNext_Flutter_QUL_Audio_Player.zip -d project
          find project -name pubspec.yaml -print

      - name: Locate Flutter project
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find project -name pubspec.yaml -print -quit)")"
          if [ "$PROJECT_DIR" = "." ] || [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml was not found in the extracted ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Upgrade Gradle wrapper
        shell: bash
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip#' "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"

      - name: Upgrade Android Gradle Plugin
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"]) / "android"
          files = [root / "settings.gradle", root / "build.gradle"]
          files += [root / "settings.gradle.kts", root / "build.gradle.kts"]
          changed = False

          for p in files:
              if not p.exists():
                  continue
              text = p.read_text()
              updated = re.sub(
                  r'(?m)(com\.android\.application["\']?\s*\)?\s+version\s+["\'])8\.1\.0(["\'])',
                  r'\g<1>8.11.1\g<2>', text
              )
              updated = re.sub(
                  r'(com\.android\.tools\.build:gradle:)8\.1\.0',
                  r'\g<1>8.11.1', updated
              )
              if updated != text:
                  p.write_text(updated)
                  print(f"Updated Android Gradle Plugin in {p}")
                  changed = True

          if not changed:
              raise SystemExit("Could not find AGP 8.1.0 in Gradle files")
          PY
          
      - name: Get Flutter dependencies
        run: cd "$PROJECT_DIR" && flutter pub get

      - name: Build APK
        run: cd "$PROJECT_DIR" && flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyahStudioNext-debug-APK
          path: project/**/build/app/outputs/flutter-apk/app-debug.apk
          
